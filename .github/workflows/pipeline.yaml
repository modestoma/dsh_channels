name: pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Releases run only from a manual dispatch on main (stable) or dev (beta).
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the next version without publishing
        type: boolean
        default: true

concurrency:
  # Each manual dispatch gets its own group so a newer dispatch never replaces
  # a pending one; the release job serializes them instead.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.23.2', '24.19.0', '26.7.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate pull request title
        if: github.event_name == 'pull_request' && matrix.node-version == '24.19.0'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/verify-pr-title.mjs
      - name: Typecheck, test, build, and verify loaders
        run: pnpm check

  # Pushes only run checks, so commits accumulate until a manual dispatch.
  # Dispatching on main publishes a stable version; on dev, a beta prerelease.
  release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: dsh-channels-release
      cancel-in-progress: false
      # Queued dispatches can differ in dry_run, so none may replace another.
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          cache: false
          install: false
      - name: Install release npm
        run: pnpm add --global npm@11.19.0
      - name: Verify release toolchain
        run: |
          node --version
          pnpm --version
          npm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify package contents
        run: pnpm pack --dry-run
      - name: Preview release
        if: inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run
      - name: Publish release
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

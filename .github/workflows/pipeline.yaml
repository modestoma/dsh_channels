name: pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # A push to dev publishes a beta. A manual dispatch on main fast-forwards main
  # to the current dev commit and publishes it as a stable version.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the next version without moving main or publishing
        type: boolean
        default: true

concurrency:
  # Each manual dispatch gets its own group so a newer dispatch never replaces
  # a pending one; the release job serializes them instead.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A manual dispatch on main releases the current dev commit. Resolving it once
  # gives check and release the same commit even if dev moves meanwhile. Other
  # events leave `ref` empty, so checkout uses the event's commit.
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.dev.outputs.sha }}
    steps:
      - id: dev
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        # A separate assignment makes a failed lookup fail the step.
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/dev" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  check:
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.23.2', '24.19.0', '26.7.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate pull request title
        if: github.event_name == 'pull_request' && matrix.node-version == '24.19.0'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/verify-pr-title.mjs
      - name: Typecheck, test, build, and verify loaders
        run: pnpm check

  # A push to dev publishes a beta prerelease once checks pass; a push to main
  # only runs checks. A manual dispatch on main fast-forwards main to the dev
  # commit resolved by `target` and publishes it as a stable version, so the
  # stable tag is on a dev commit and dev never needs main merged back. On dev
  # a manual dispatch previews or publishes a beta.
  release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    needs: [target, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: dsh-channels-release
      cancel-in-progress: false
      # Queued runs can differ in dry_run, so none may replace another.
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          cache: false
          install: false
      - name: Install release npm
        run: pnpm add --global npm@11.19.0
      - name: Verify release toolchain
        run: |
          node --version
          pnpm --version
          npm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify package contents
        run: pnpm pack --dry-run
      # A plain push rejects a non-fast-forward update, so main only ever moves
      # to a commit that already contains it.
      - name: Verify main fast-forwards to dev
        if: needs.target.outputs.ref != ''
        run: |
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main has commits that dev does not contain. Merge main into dev, then release again."
            exit 1
          fi
      - name: Fast-forward main to dev
        if: needs.target.outputs.ref != '' && !inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/main
      - name: Preview release
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run
      - name: Publish release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

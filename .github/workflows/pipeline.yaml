name: pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # A push to dev publishes a beta. A manual dispatch on main fast-forwards main
  # to the current dev commit and publishes it as a stable version.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the next version without moving main or publishing
        type: boolean
        default: true

concurrency:
  # Each manual dispatch gets its own group so a newer dispatch never replaces
  # a pending one; the release job serializes them instead.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A manual dispatch on main releases the current dev commit. When main is
  # behind dev, a real release fast-forwards main and dispatches a new run on
  # main, which publishes at the promoted commit: npm provenance records the
  # triggering commit, and only a run started after the move has the promoted
  # one. A dry run skips the move and previews the dev commit. Every other run
  # keeps the event's commit (`ref` empty) and proceeds (`release` true).
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    outputs:
      ref: ${{ steps.promote.outputs.ref }}
      release: ${{ steps.promote.outputs.release }}
    steps:
      - id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A run dispatched by this job after the move publishes main as is.
          if [ "$MAIN_DISPATCH" != true ] || [ "$GITHUB_ACTOR" = 'github-actions[bot]' ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dev=$(gh api "repos/$GITHUB_REPOSITORY/commits/dev" --jq .sha)
          if [ "$dev" = "$GITHUB_SHA" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$dev" --jq .status)
          if [ "$status" != ahead ]; then
            echo "::error::main has commits that dev does not contain (dev is $status). Merge main into dev, then release again."
            exit 1
          fi
          if [ "$DRY_RUN" = true ]; then
            { echo "ref=$dev"; echo "release=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Without force, GitHub rejects an update that is not a fast-forward.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f sha="$dev" -F force=false --silent
          workflow=${GITHUB_WORKFLOW_REF%@*}
          gh workflow run "${workflow##*/}" --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false
          echo "::notice::main fast-forwarded to $dev; the stable release continues in a new pipeline run on main."
          echo "release=false" >> "$GITHUB_OUTPUT"

  check:
    needs: promote
    if: needs.promote.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.23.2', '24.19.0', '26.7.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.promote.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate pull request title
        if: github.event_name == 'pull_request' && matrix.node-version == '24.19.0'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/verify-pr-title.mjs
      - name: Typecheck, test, build, and verify loaders
        run: pnpm check

  # A push to dev publishes a beta prerelease once checks pass; a push to main
  # only runs checks. A manual dispatch on main publishes a stable version once
  # `promote` has main at the dev commit, so the stable tag is on a dev commit
  # and dev never needs main merged back. On dev a manual dispatch previews or
  # publishes a beta.
  release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    needs: [promote, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: dsh-channels-release
      cancel-in-progress: false
      # Queued runs can differ in dry_run, so none may replace another.
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.promote.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          cache: false
          install: false
      - name: Install release npm
        run: pnpm add --global npm@11.19.0
      - name: Verify release toolchain
        run: |
          node --version
          pnpm --version
          npm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify package contents
        run: pnpm pack --dry-run
      - name: Preview release
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run
      - name: Publish release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

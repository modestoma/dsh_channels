name: pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # A push to main publishes a stable version. A manual dispatch on dev
  # publishes a beta; on main it retries or previews the stable release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the next version without publishing
        type: boolean
        default: false

concurrency:
  # Each manual dispatch gets its own group so a newer dispatch never replaces
  # a pending one; the release job serializes them instead.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.23.2', '24.19.0', '26.7.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate pull request title
        if: github.event_name == 'pull_request' && matrix.node-version == '24.19.0'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/verify-pr-title.mjs
      - name: Typecheck, test, build, and verify loaders
        run: pnpm check

  # A push to main (a direct push or a merged pull request) publishes a stable
  # version once checks pass; a push to dev only runs checks. A manual dispatch
  # on dev previews or publishes a beta; on main it previews or retries the
  # stable release of main's current commit.
  release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: dsh-channels-release
      cancel-in-progress: false
      # Queued runs can differ in dry_run, so none may replace another.
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          cache: false
          install: false
      - name: Install release npm
        run: pnpm add --global npm@11.19.0
      - name: Verify release toolchain
        run: |
          node --version
          pnpm --version
          npm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify package contents
        run: pnpm pack --dry-run
      - name: Preview release
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run
      - name: Publish release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

  # semantic-release counts a dev beta from the newest tag in dev's history, so
  # dev must contain every commit that main released; otherwise the next beta
  # repeats the version just published. After a stable release this job
  # fast-forwards dev to the released commit, or merges it into dev when dev
  # has commits of its own.
  sync-dev:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || !inputs.dry_run)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: dsh-channels-release
      cancel-in-progress: false
      queue: max
    steps:
      - name: Bring the released commit into dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/dev...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical | behind)
              echo "::notice::dev already contains $GITHUB_SHA."
              exit 0
              ;;
            ahead)
              # Without force, GitHub rejects the update if dev moved meanwhile;
              # the merge below then handles the new dev commits.
              if gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/dev" -f sha="$GITHUB_SHA" -F force=false --silent; then
                echo "::notice::dev fast-forwarded to $GITHUB_SHA."
                exit 0
              fi
              ;;
          esac
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/merges" -f base=dev -f head="$GITHUB_SHA" -f commit_message="chore: merge main into dev after stable release" --silent; then
            echo "::error::Could not bring $GITHUB_SHA into dev (merge conflict or branch protection). Merge main into dev with a pull request before the next beta."
            exit 1
          fi
          echo "::notice::Merged $GITHUB_SHA into dev."

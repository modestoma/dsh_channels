name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs are preview-only; the release job uses --dry-run for this event.
  workflow_dispatch:

concurrency:
  # Keep manual previews independent from production pushes.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.23.2', '24.19.0', '26.7.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate pull request title
        if: github.event_name == 'pull_request' && matrix.node-version == '24.19.0'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/verify-pr-title.mjs
      - name: Typecheck, test, build, and verify loaders
        run: pnpm check

  # A green push to main publishes automatically. A manual run executes the
  # same release analysis in dry-run mode without creating external state.
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: dsh-channels-release-${{ github.event_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          cache: false
          install: false
      - name: Install release npm
        run: pnpm add --global npm@11.19.0
      - name: Verify release toolchain
        run: |
          node --version
          pnpm --version
          npm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify package contents
        run: pnpm pack --dry-run
      - name: Preview release
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
